name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install API dependencies
        run: uv sync --all-packages --dev

      - name: Lint backend services
        run: uv run ruff check apps/api apps/consumer apps/worker

      - name: Typecheck backend services
        run: MYPYPATH=apps/api:apps/consumer:apps/worker uv run mypy apps/api/app apps/api/tests apps/consumer/consumer_app apps/consumer/tests apps/worker/worker_app apps/worker/tests

      - name: Test backend services
        run: PYTHONPATH=apps/api:apps/consumer:apps/worker uv run pytest apps/api/tests apps/consumer/tests apps/worker/tests

      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t dealmoa-api-ci .

      - name: Build consumer Docker image
        run: docker build -f apps/consumer/Dockerfile -t dealmoa-consumer-ci .

      - name: Build worker Docker image
        run: docker build -f apps/worker/Dockerfile -t dealmoa-worker-ci .

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter @dealmoa/web lint

      - name: Typecheck web
        run: pnpm --filter @dealmoa/web typecheck

      - name: Test web
        run: pnpm --filter @dealmoa/web test

      - name: Build web
        run: pnpm --filter @dealmoa/web build

      - name: Install Playwright browser
        run: pnpm --filter @dealmoa/web exec playwright install --with-deps chromium

      - name: Run web smoke e2e
        run: pnpm --filter @dealmoa/web e2e
