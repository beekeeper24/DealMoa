name: Task
description: Track a planned implementation, documentation, infrastructure, or cleanup slice.
title: "[Task] "
labels:
  - task
body:
  - type: markdown
    attributes:
      value: |
        MVP 슬라이스나 운영 작업처럼 이미 방향이 정해진 일을 추적합니다.
        Task는 PR-sized coherent slice로 작성합니다. 중간 구현 단계만 따로 Task로 만들지 말고, 작은 단계는 Acceptance criteria나 체크리스트에 넣습니다.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true after this task?
      placeholder: 이 작업이 끝났을 때 달라지는 점을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What files, modules, or behaviors are expected to change?
      placeholder: |
        - PR 하나로 리뷰해도 자연스러운 기능/운영 범위
        - 작은 중간 단계는 별도 이슈가 아니라 이 이슈의 체크리스트로 정리
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What confirms that this task is complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Which tests, builds, checks, or manual QA should run?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Constraints, non-goals, related docs, or implementation hints.
      placeholder: 관련 문서, 제외 범위, 주의할 점을 적어 주세요.
    validations:
      required: false
