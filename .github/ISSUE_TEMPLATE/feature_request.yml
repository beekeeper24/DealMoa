name: Feature request
description: Propose a user-facing or operator-facing capability.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        사용자나 운영자에게 제공할 새 기능을 제안합니다. 구현 세부보다 문제, 목표, 완료 조건을 먼저 적어 주세요.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem does this solve?
      placeholder: 어떤 문제를 해결하려는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the product do?
      placeholder: 원하는 동작을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true before this is done?
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - apps/api
        - apps/web
        - apps/worker
        - apps/consumer
        - docker-compose
        - docs
        - ci
        - other
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What is intentionally out of scope?
      placeholder: 이번 이슈에서 하지 않을 일을 적어 주세요.
    validations:
      required: false
