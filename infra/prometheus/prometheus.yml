global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: dealmoa-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: dealmoa-consumer
    static_configs:
      - targets:
          - consumer:9101

  - job_name: dealmoa-worker
    static_configs:
      - targets:
          - worker:9102
