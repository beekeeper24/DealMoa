services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealmoa}
      POSTGRES_USER: ${POSTGRES_USER:-dealmoa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealmoa-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    profiles: ["event"]
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - kafka_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 10

  elasticsearch:
    build:
      context: .
      dockerfile: infra/elasticsearch/Dockerfile
    profiles: ["core"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["core"]
    environment:
      API_ENV: ${API_ENV:-local}
      API_PROJECT_NAME: ${API_PROJECT_NAME:-DealMoa API}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      PORT: ${PORT:-8000}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      API_METRICS_ENABLED: ${API_METRICS_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dealmoa:dealmoa-local-password@postgres:5432/dealmoa}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      AI_REVIEW_PROVIDER: ${AI_REVIEW_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-8}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_DOMAIN_EVENTS_TOPIC: ${KAFKA_DOMAIN_EVENTS_TOPIC:-dealmoa.domain-events}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-local-jwt-secret-minimum-32-bytes}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-14}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-dm_refresh_token}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
      AUTH_REFRESH_COOKIE_SAMESITE: ${AUTH_REFRESH_COOKIE_SAMESITE:-lax}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-${OAUTH2_GOOGLE_CLIENT_ID:-}}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-${OAUTH2_GOOGLE_CLIENT_SECRET:-}}
      OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID:-${OAUTH2_KAKAO_CLIENT_ID:-}}
      OAUTH_KAKAO_CLIENT_SECRET: ${OAUTH_KAKAO_CLIENT_SECRET:-${OAUTH2_KAKAO_CLIENT_SECRET:-}}
      OAUTH_NAVER_CLIENT_ID: ${OAUTH_NAVER_CLIENT_ID:-${OAUTH2_NAVER_CLIENT_ID:-}}
      OAUTH_NAVER_CLIENT_SECRET: ${OAUTH_NAVER_CLIENT_SECRET:-${OAUTH2_NAVER_CLIENT_SECRET:-}}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: ["core"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-${WEB_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  consumer:
    build:
      context: .
      dockerfile: apps/consumer/Dockerfile
    profiles: ["event"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dealmoa:dealmoa-local-password@postgres:5432/dealmoa}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_DOMAIN_EVENTS_TOPIC: ${KAFKA_DOMAIN_EVENTS_TOPIC:-dealmoa.domain-events}
      KAFKA_SEARCH_INDEX_GROUP_ID: ${KAFKA_SEARCH_INDEX_GROUP_ID:-dealmoa-search-indexer}
      KAFKA_NOTIFICATION_GROUP_ID: ${KAFKA_NOTIFICATION_GROUP_ID:-dealmoa-notification-generator}
      CONSUMER_POLL_INTERVAL_SECONDS: ${CONSUMER_POLL_INTERVAL_SECONDS:-1}
      CONSUMER_BATCH_SIZE: ${CONSUMER_BATCH_SIZE:-100}
      CONSUMER_METRICS_ENABLED: ${CONSUMER_METRICS_ENABLED:-true}
      CONSUMER_METRICS_PORT: ${CONSUMER_METRICS_PORT:-9101}
    ports:
      - "${CONSUMER_METRICS_HOST_PORT:-${CONSUMER_METRICS_PORT:-9101}}:${CONSUMER_METRICS_PORT:-9101}"
    command:
      [
        "/workspace/.venv/bin/python",
        "-m",
        "consumer_app.main",
        "publish-outbox",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    profiles: ["worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dealmoa:dealmoa-local-password@postgres:5432/dealmoa}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      AUCTION_ENDING_SOON_LOOKAHEAD_MINUTES: ${AUCTION_ENDING_SOON_LOOKAHEAD_MINUTES:-60}
      AUCTION_ENDING_SOON_BATCH_SIZE: ${AUCTION_ENDING_SOON_BATCH_SIZE:-100}
      AUCTION_ENDING_SOON_SCHEDULE_SECONDS: ${AUCTION_ENDING_SOON_SCHEDULE_SECONDS:-300}
      CRAWLER_SYSTEM_USER_ID: ${CRAWLER_SYSTEM_USER_ID:-system-crawler}
      CRAWLER_SYSTEM_USER_EMAIL: ${CRAWLER_SYSTEM_USER_EMAIL:-crawler@dealmoa.local}
      CRAWLER_SYSTEM_USER_NICKNAME: ${CRAWLER_SYSTEM_USER_NICKNAME:-DealMoa Crawler}
      CRAWLER_SOURCE_PROFILES: ${CRAWLER_SOURCE_PROFILES:-mock.example.com:trusted:allow}
      CRAWLER_SOURCE_PARSERS: ${CRAWLER_SOURCE_PARSERS:-mock.example.com:dealmoa_article}
      CRAWLER_LIVE_URLS: ${CRAWLER_LIVE_URLS:-}
      CRAWLER_HTTP_TIMEOUT_SECONDS: ${CRAWLER_HTTP_TIMEOUT_SECONDS:-5}
      CRAWLER_HTTP_MAX_BYTES: ${CRAWLER_HTTP_MAX_BYTES:-1048576}
      CRAWLER_MAX_URLS_PER_HOST: ${CRAWLER_MAX_URLS_PER_HOST:-20}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-DealMoaBot/0.1 (+https://dealmoa.local/crawler)}
      WORKER_METRICS_ENABLED: ${WORKER_METRICS_ENABLED:-true}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9102}
    ports:
      - "${WORKER_METRICS_HOST_PORT:-${WORKER_METRICS_PORT:-9102}}:${WORKER_METRICS_PORT:-9102}"
    command:
      [
        "/workspace/.venv/bin/celery",
        "-A",
        "worker_app.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--pool=solo",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-beat:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    profiles: ["worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dealmoa:dealmoa-local-password@postgres:5432/dealmoa}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      AUCTION_ENDING_SOON_LOOKAHEAD_MINUTES: ${AUCTION_ENDING_SOON_LOOKAHEAD_MINUTES:-60}
      AUCTION_ENDING_SOON_BATCH_SIZE: ${AUCTION_ENDING_SOON_BATCH_SIZE:-100}
      AUCTION_ENDING_SOON_SCHEDULE_SECONDS: ${AUCTION_ENDING_SOON_SCHEDULE_SECONDS:-300}
      CRAWLER_SYSTEM_USER_ID: ${CRAWLER_SYSTEM_USER_ID:-system-crawler}
      CRAWLER_SYSTEM_USER_EMAIL: ${CRAWLER_SYSTEM_USER_EMAIL:-crawler@dealmoa.local}
      CRAWLER_SYSTEM_USER_NICKNAME: ${CRAWLER_SYSTEM_USER_NICKNAME:-DealMoa Crawler}
      CRAWLER_SOURCE_PROFILES: ${CRAWLER_SOURCE_PROFILES:-mock.example.com:trusted:allow}
      CRAWLER_SOURCE_PARSERS: ${CRAWLER_SOURCE_PARSERS:-mock.example.com:dealmoa_article}
      CRAWLER_LIVE_URLS: ${CRAWLER_LIVE_URLS:-}
      CRAWLER_HTTP_TIMEOUT_SECONDS: ${CRAWLER_HTTP_TIMEOUT_SECONDS:-5}
      CRAWLER_HTTP_MAX_BYTES: ${CRAWLER_HTTP_MAX_BYTES:-1048576}
      CRAWLER_MAX_URLS_PER_HOST: ${CRAWLER_MAX_URLS_PER_HOST:-20}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-DealMoaBot/0.1 (+https://dealmoa.local/crawler)}
    command:
      [
        "/workspace/.venv/bin/celery",
        "-A",
        "worker_app.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.8.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:12.1.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dealmoa-local-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jmeter:
    image: alpine/jmeter:5.6.3
    profiles: ["loadtest"]
    working_dir: /jmeter
    volumes:
      - ./infra/jmeter:/jmeter
    command:
      [
        "-f",
        "-n",
        "-t",
        "/jmeter/dealmoa-search-baseline.jmx",
        "-l",
        "/jmeter/results/dealmoa-search-baseline.jtl",
        "-j",
        "/jmeter/results/jmeter.log",
        "-Japi_base_url=${JMETER_API_BASE_URL:-http://api:8000}",
        "-Japi_prefix=${JMETER_API_PREFIX:-/api/v1}",
        "-Jthreads=${JMETER_THREADS:-5}",
        "-Jramp_seconds=${JMETER_RAMP_SECONDS:-30}",
        "-Jduration_seconds=${JMETER_DURATION_SECONDS:-60}",
        "-Jsearch_query=${JMETER_SEARCH_QUERY:-Galaxy}",
        "-Jsearch_limit=${JMETER_SEARCH_LIMIT:-10}",
        "-Jthink_time_ms=${JMETER_THINK_TIME_MS:-250}",
      ]

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  kafka_data:
  prometheus_data:
  grafana_data:
