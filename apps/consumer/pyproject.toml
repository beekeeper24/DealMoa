[project]
name = "dealmoa-consumer"
version = "0.1.0"
description = "DealMoa Kafka consumer service"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.12.0",
    "prometheus-client>=0.23.1",
    "psycopg[binary]>=3.2.10",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.44",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["apps/consumer", "apps/api"]
