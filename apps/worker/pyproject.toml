[project]
name = "dealmoa-worker"
version = "0.1.0"
description = "DealMoa Celery worker service"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.5.3",
    "httpx>=0.28.1",
    "prometheus-client>=0.23.1",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.13.0",
    "psycopg[binary]>=3.2.10",
    "sqlalchemy>=2.0.44",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["apps/worker"]
