[project]
name = "dealmoa-api"
version = "0.1.0"
description = "DealMoa FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.0",
    "fastapi>=0.119.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.10",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.37.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
